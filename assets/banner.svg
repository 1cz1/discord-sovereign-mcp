      <stop offset="0" stop-color="#7a88ff"/>
      <stop offset="1" stop-color="#4a57e0"/>
    </linearGradient>
    <radialGradient id="dsm-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
