<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="discord-sovereign-mcp banner">
  <defs>
    <radialGradient id="dsm-glow-p" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dsm-glow-g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff85" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00ff85" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dsm-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a88ff"/>
      <stop offset="1" stop-color="#4a57e0"/>
    </linearGradient>
    <g id="dsm-mark">
      <path d="M200 40 L320 92 V192 C320 262 268 306 200 330 C132 306 80 262 80 192 V92 Z"
            fill="url(#dsm-shield)" opacity="0.22" stroke="#00ff85" stroke-width="10" stroke-linejoin="round"/>
      <path d="M200 68 L294 110 V192 C294 246 254 280 200 300 C146 280 106 246 106 192 V110 Z"
            fill="none" stroke="#5865f2" stroke-width="2"/>
      <path d="M128 92 L152 128 L176 96 L194 120 L212 96 L236 128 L260 92 L250 146 H138 Z"
            fill="#00ff85" stroke="#0a0b0e" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="200" cy="152" r="6" fill="#0a0b0e"/>
      <path d="M162 200 L184 222 L226 178" fill="none" stroke="#00ff85" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="#0a0b0e"/>

  <!-- hairline grid -->
  <g stroke="#151a24" stroke-width="1">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280 M0 480 H1280 M0 560 H1280"/>
    <path d="M160 0 V640 M320 0 V640 M480 0 V640 M640 0 V640 M800 0 V640 M960 0 V640 M1120 0 V640"/>
  </g>

  <!-- glows -->
  <circle cx="260" cy="240" r="430" fill="url(#dsm-glow-p)"/>
  <circle cx="1150" cy="540" r="320" fill="url(#dsm-glow-g)"/>

  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- logo mark -->
  <use href="#dsm-mark" transform="translate(60 130) scale(1.05)"/>

  <!-- wordmark -->
  <text x="520" y="212" fill="#f0f3f8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
