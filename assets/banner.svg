  <text x="522" y="296" fill="#00ff85" font-family="'Cascadia Code', 'Consolas', monospace"
        font-size="24" font-weight="700">THE #1 ROLE OR NOTHING</text>

  <line x1="522" y1="322" x2="1010" y2="322" stroke="#21262d" stroke-width="1.5"/>

  <!-- feature pills -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">
    <g>
      <rect x="522" y="344" width="118" height="36" rx="18" fill="#12151c" stroke="#21262d"/>
      <text x="581" y="367" fill="#d5dbe4" text-anchor="middle">46 TOOLS</text>
    </g>
    <g>
      <rect x="652" y="344" width="146" height="36" rx="18" fill="#12151c" stroke="#21262d"/>
      <text x="725" y="367" fill="#d5dbe4" text-anchor="middle">STDIO · HTTP</text>
    </g>
    <g>
      <rect x="810" y="344" width="196" height="36" rx="18" fill="#12151c" stroke="#21262d"/>
      <text x="908" y="367" fill="#d5dbe4" text-anchor="middle">OAUTH2 BOOTSTRAP</text>
    </g>
    <g>
      <rect x="1018" y="344" width="160" height="36" rx="18" fill="#12151c" stroke="#21262d"/>
      <text x="1098" y="367" fill="#d5dbe4" text-anchor="middle">DRY-RUN SAFETY</text>
    </g>
  </g>

  <!-- terminal card -->
  <g>
    <rect x="522" y="404" width="580" height="122" rx="12" fill="#0d1117" stroke="#21262d"/>
    <circle cx="544" cy="424" r="6" fill="#ff5f56"/>
    <circle cx="564" cy="424" r="6" fill="#ffbd2e"/>
    <circle cx="584" cy="424" r="6" fill="#27c93f"/>
    <text x="522" y="466" fill="#c9d1d9" font-family="'Cascadia Code', 'Consolas', monospace" font-size="16">$ npx discord-sovereign-mcp@latest --install</text>
    <text x="522" y="494" fill="#00ff85" font-family="'Cascadia Code', 'Consolas', monospace" font-size="15">✓ 9 clients detected · configs written for every IDE</text>
    <text x="522" y="514" fill="#8b949e" font-family="'Cascadia Code', 'Consolas', monospace" font-size="15">  token: DISCORD_TOKEN · guard: enforced server-side</text>
  </g>

  <!-- corner meta -->
  <text x="1236" y="52" fill="#5865f2" font-family="'Cascadia Code', 'Consolas', monospace"
        font-size="18" font-weight="700" text-anchor="end">v0.2.0</text>
  <text x="1236" y="74" fill="#484f58" font-family="'Cascadia Code', 'Consolas', monospace"
        font-size="13" text-anchor="end">MIT · node ≥ 20 · zero config</text>
</svg>