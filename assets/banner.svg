  <line x1="104" y1="74" x2="418" y2="74" stroke="#5865f2" stroke-width="3" stroke-linecap="round"/>

  <text x="104" y="96" fill="#8b949e" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
